<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Ilustração de um anel quase completo com o número 97,9M, as unidades do PS5 distribuídas até agora">
<defs>
<linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F4C5C"/><stop offset="1" stop-color="#0A2A33"/></linearGradient>
<radialGradient id="brilho" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9CC3C7" stop-opacity=".26"/><stop offset="1" stop-color="#9CC3C7" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="450" fill="url(#fundo)"/>
<circle cx="400" cy="225" r="250" fill="url(#brilho)"/>
<g transform="translate(400 225) rotate(-90)" fill="none">
<circle r="150" stroke="#F4EDE4" stroke-opacity=".14" stroke-width="26"/>
<circle r="150" stroke="#E76F51" stroke-width="26" stroke-dasharray="922.7 19.8"/>
</g>
<text x="400" y="244" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-weight="700" font-size="76" fill="#F4EDE4">97,9M</text>
