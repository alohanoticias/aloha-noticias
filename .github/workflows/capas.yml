name: Montar capas com fotos
on:
  push:
    branches: [main]
    paths: ["site/capas_fotos/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: sudo apt-get install -y fonts-inter || true
      - name: Montar as capas que ainda não existem
        run: python3 site/montar_capa.py
      - name: Regenerar o site e enviar
        if: always()
        run: |
          python3 site/gerar.py
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Capas montadas com fotos"
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            echo "Push recusado (outra automação gravou antes); tentativa $i, atualizando e tentando de novo"
            sleep $((i * 3))
            git pull --rebase -X theirs -q || git rebase --abort
            python3 site/gerar.py
            git add -A
            git diff --cached --quiet || git commit -qm "Regenera site"
          done
          exit 1
