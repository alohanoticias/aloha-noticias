name: Aprovar ou rejeitar rascunho
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  decidir:
    if: >-
      github.event.issue.user.login == 'alohanoticias' && (startsWith(github.event.issue.title, 'Aprovar: ') || startsWith(github.event.issue.title, 'Reagendar: ') || startsWith(github.event.issue.title, 'Rejeitar: '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar decisão
        env:
          TITULO: ${{ github.event.issue.title }}
        run: |
          python3 site/aprovar.py "$TITULO"
          python3 site/gerar.py
      - name: Enviar alteração
        run: |
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git commit -m "Decisão do admin: ${{ github.event.issue.number }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            echo "Push recusado (outra automação gravou antes); tentativa $i, atualizando e tentando de novo"
            sleep $((i * 3))
            git pull --rebase -X theirs -q || git rebase --abort
            python3 site/gerar.py
            git add -A
            git diff --cached --quiet || git commit -qm "Regenera site"
          done
          exit 1
      - name: Fechar o pedido
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Feito. O site atualiza em cerca de 1 minuto." --repo ${{ github.repository }}
