name: Medir fotos das capas
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Endereços de imagens (separados por espaço); vazio = fotos das capas"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow numpy
      - env:
          URLS: ${{ github.event.inputs.urls }}
        run: python3 site/medir_fotos.py $URLS
