name: Montar banner
on:
  workflow_dispatch:
  push:
    branches: [banner-previa]
    paths: ["site/banner.json", "site/montar_banner.py"]
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 site/montar_banner.py 2>&1 | tee site/banner-log.txt
      - name: Enviar
        run: |
          [ "${GITHUB_REF_NAME}" = "main" ] && python3 site/gerar.py
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Banner com imagens novas"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
