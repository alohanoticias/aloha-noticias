name: Montar banner
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 site/montar_banner.py
      - name: Enviar
        run: |
          python3 site/gerar.py
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Banner com imagens novas"
          git pull --rebase -q
          git push
