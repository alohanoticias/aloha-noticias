name: Montar banner
on:
  workflow_dispatch:
  push:
    branches: [banner-previa]
    paths: ["site/banner.json", "site/montar_banner.py"]
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy
      - uses: actions/cache@v4
        with:
          path: ia_modelos
          key: realesrgan-v1
      - name: Instalar o aprimorador de imagem (IA)
        continue-on-error: true
        run: |
          # torch (CPU) primeiro e depois o spandrel; a rede às vezes corta o download, então tenta até 4 vezes
          for i in 1 2 3 4; do
            pip install -q --no-cache-dir --retries 10 --timeout 60 torch --index-url https://download.pytorch.org/whl/cpu \
              && pip install -q --no-cache-dir --retries 10 --timeout 60 spandrel \
              && python3 -c "import torch, spandrel" && break
            echo "instalação da IA falhou (tentativa $i), tentando de novo"; sleep $((i * 15))
          done
          python3 -c "import torch, spandrel"
          mkdir -p ia_modelos
          [ -s ia_modelos/RealESRGAN_x4plus.pth ] || curl -sSfL -o ia_modelos/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
      - run: python3 site/montar_banner.py 2>&1 | tee site/banner-log.txt
      - name: Enviar
        run: |
          [ "${GITHUB_REF_NAME}" = "main" ] && python3 site/gerar.py
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Banner com imagens novas"
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            sleep $((i * 3))
            git pull --rebase -X theirs -q origin "${GITHUB_REF_NAME}" || git rebase --abort
            [ "${GITHUB_REF_NAME}" = "main" ] && python3 site/gerar.py
            git add -A
            git diff --cached --quiet || git commit -qm "Regenera site"
          done
          exit 1
