name: Telegram (teste ou postar matérias)
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs das matérias para postar no canal, separados por espaço. Escreva 'todas' para postar todas as publicadas, 'descobrir' para ver os canais do bot, 'botoes' para tratar os botões agora, 'limpar' para apagar tudo do canal de rascunho. Vazio = só mensagem de teste."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "ERRO: segredo TELEGRAM_BOT_TOKEN não encontrado"; exit 1; }
          [ -n "$TELEGRAM_CHAT_ID" ] || { echo "ERRO: segredo TELEGRAM_CHAT_ID não encontrado"; exit 1; }
          if [ -z "$SLUGS" ]; then
            T=$(printf %s "$TELEGRAM_BOT_TOKEN" | tr -d " \t\r\n'\""); T=${T#bot}
            echo "Token: ${#T} caracteres, formato $(printf %s "$T" | grep -qE '^[0-9]+:[A-Za-z0-9_-]{30,}$' && echo certo || echo ERRADO)"
            C=$(printf %s "$TELEGRAM_CHAT_ID" | tr -d " \t\r\n'\""); case "$C" in @*|-*|[0-9]*) ;; *) C="@${C##*/}";; esac
            curl -sS "https://api.telegram.org/bot$T/sendMessage" --data-urlencode "chat_id=$C" \
              --data-urlencode "text=Teste: o site já consegue postar aqui. 🌺" | tee /tmp/r.json
            grep -q '"ok":true' /tmp/r.json || exit 1
          elif [ "$SLUGS" = "descobrir" ]; then
            python3 site/telegram_aprovar.py descobrir
          elif [ "${SLUGS%% *}" = "limpar" ]; then
            python3 site/telegram_aprovar.py $SLUGS
          elif [ "${SLUGS%% *}" = "fila" ] || [ "${SLUGS%% *}" = "fila-adicionar" ]; then
            python3 site/telegram_aprovar.py $SLUGS
            git config user.name "aloha-bot" && git config user.email "contato@alohanoticias.com"
            git add site/conteudo/telegram_fila.json && git commit -qm "Telegram: fila de posts" && git push -q
          elif [ "${SLUGS%% *}" = "corrigir-botao" ] || [ "${SLUGS%% *}" = "postar-agora" ] || [ "${SLUGS%% *}" = "verificar" ] || [ "${SLUGS%% *}" = "mapear" ]; then
            python3 site/telegram_aprovar.py $SLUGS
          elif [ "$SLUGS" = "botoes" ]; then
            python3 site/telegram_aprovar.py
          elif [ "$SLUGS" = "todas" ]; then
            python3 site/enviar_telegram.py $(python3 -c "import json;print(' '.join(m['slug'] for m in sorted(json.load(open('site/conteudo/materias.json')),key=lambda m:m['data'])))")
          else
            python3 site/enviar_telegram.py $SLUGS
          fi
