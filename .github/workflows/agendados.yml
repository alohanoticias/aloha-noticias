name: Publicar agendados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-agendados
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o que já está na hora
        run: |
          python3 site/publicar_agendados.py
          python3 site/gerar.py
      - name: Enviar alteração
        run: |
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publica artigo agendado"
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            echo "Push recusado (outra automação gravou antes); tentativa $i, atualizando e tentando de novo"
            sleep $((i * 3))
            git pull --rebase -X theirs -q || git rebase --abort
            python3 site/gerar.py
            git add -A
            git diff --cached --quiet || git commit -qm "Regenera site"
          done
          exit 1
