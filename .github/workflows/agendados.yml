name: Publicar agendados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-agendados
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar o que já está na hora
        run: |
          python3 site/publicar_agendados.py
          python3 site/gerar.py
          cp publicados.txt /tmp/publicados.txt 2>/dev/null || true
          rm -f publicados.txt
      - name: Enviar alteração
        run: |
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publica artigo agendado"
          for i in 1 2 3 4 5 6; do
            git push && exit 0
            echo "Push recusado (outra automação gravou antes); tentativa $i, atualizando e tentando de novo"
            sleep $((i * 3))
            git pull --rebase -X theirs -q || git rebase --abort
            python3 site/gerar.py
            git add -A
            git diff --cached --quiet || git commit -qm "Regenera site"
          done
          exit 1
      - name: Esperar o site novo entrar no ar
        run: |
          [ -f /tmp/publicados.txt ] || exit 0
          sleep 90
      - name: Postar no canal do Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f /tmp/publicados.txt ] || exit 0
          cp /tmp/publicados.txt publicados.txt
          python3 site/enviar_telegram.py
      - name: Enviar aviso push das matérias publicadas
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          [ -f /tmp/publicados.txt ] || exit 0
          cp /tmp/publicados.txt publicados.txt
          python3 site/enviar_push.py
