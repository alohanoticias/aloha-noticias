name: Previas de imagens
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "urls ou revisao"
        required: true
        default: "revisao"
      urls:
        description: "URLs (modo urls), separadas por espaço"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  previas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - env:
          URLS: ${{ inputs.urls }}
        run: python3 site/previas.py ${{ inputs.modo }} $URLS
      - run: |
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          git add -A site/candidatas
          git diff --cached --quiet && exit 0
          git commit -m "Previas de imagens"
          for i in 1 2 3 4; do git push && exit 0; sleep 4; git pull --rebase -q; done
