name: Capas com IA (prévia para aprovar)
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs das capas separados por espaço, ou 'todas'"
        required: true
        default: "todas"
permissions:
  contents: write
jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.l.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        env:
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          if [ "$SLUGS" = "todas" ]; then SLUGS=$(ls site/capas_fotos | sed 's/\.json$//'); fi
          echo "slugs=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1:]))' $SLUGS)" >> $GITHUB_OUTPUT
  ia:
    needs: lista
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        slug: ${{ fromJSON(needs.lista.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-inter >/dev/null || true
      - name: Instalar a IA (Real-ESRGAN, só CPU)
        run: |
          pip install -q --no-cache-dir pillow numpy
          for i in 1 2 3 4; do
            pip install -q --no-cache-dir --retries 10 --timeout 60 torch --index-url https://download.pytorch.org/whl/cpu \
              && pip install -q --no-cache-dir --retries 10 --timeout 60 spandrel \
              && python3 -c "import torch, spandrel" && break
            echo "instalação da IA falhou (tentativa $i), tentando de novo"; sleep $((i * 15))
          done
          python3 -c "import torch, spandrel"
          mkdir -p ia_modelos
          curl -sSL -o ia_modelos/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          curl -sSL -o ia_modelos/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
      - name: Remontar a capa com as fotos aprimoradas
        run: python3 site/capa_ia.py ${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capa-ia-${{ strategy.job-index }}
          path: ia_saida/
          retention-days: 7
          if-no-files-found: ignore
  juntar:
    needs: ia
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: todas
          merge-multiple: true
      - name: Guardar a prévia no ramo ia-previa (o site não muda)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd todas && ls
          git init -q && git checkout -q -b ia-previa
          git config user.name "aloha-bot" && git config user.email "contato@alohanoticias.com"
          git add -A && git commit -qm "Prévia das capas com IA"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ia-previa
