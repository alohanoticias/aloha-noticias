name: Capas com informação
on:
  push:
    branches: [main]
    paths: ["site/capas_info/.rodar"]   # só roda quando este arquivo muda (rodada pedida de propósito)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capas-info
  cancel-in-progress: false
jobs:
  capas:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Ver se há capa pendente
        id: p
        run: |
          pip install -q pillow numpy opencv-python-headless
          echo "n=$(python3 site/capa_info.py --pendentes)" >> $GITHUB_OUTPUT
      - if: steps.p.outputs.n != '0'
        run: sudo apt-get install -y fonts-inter || true
      - if: steps.p.outputs.n != '0'
        uses: actions/cache@v4
        with:
          path: ia_modelos
          key: realesrgan-v1
      - name: Instalar o aprimorador de imagem (IA)
        if: steps.p.outputs.n != '0'
        continue-on-error: true
        run: |
          # torch (CPU) primeiro e depois o spandrel; a rede às vezes corta o download, então tenta até 4 vezes
          for i in 1 2 3 4; do
            pip install -q --no-cache-dir --retries 10 --timeout 60 torch torchvision --index-url https://download.pytorch.org/whl/cpu \
              && pip install -q --no-cache-dir --retries 10 --timeout 60 spandrel \
              && python3 -c "import torch, spandrel" && break
            echo "instalação da IA falhou (tentativa $i), tentando de novo"; sleep $((i * 15))
          done
          python3 -c "import torch, spandrel"
          mkdir -p ia_modelos
          [ -s ia_modelos/RealESRGAN_x4plus.pth ] || curl -sSfL -o ia_modelos/RealESRGAN_x4plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          [ -s ia_modelos/RealESRGAN_x4plus_anime_6B.pth ] || curl -sSfL -o ia_modelos/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
      - name: Montar e enviar aos poucos (a cada ~15 min o que ficou pronto vai para o site)
        if: steps.p.outputs.n != '0'
        run: |
          git config user.name "aloha-bot"
          git config user.email "contato@alohanoticias.com"
          enviar() {
            # guarda o que foi montado, pega a versão mais nova do site e põe por cima (sem conflito com outras automações)
            rm -rf /tmp/guarda && mkdir -p /tmp/guarda
            mkdir -p /tmp/guarda/capas /tmp/guarda/base
            for f in $(cat /tmp/novas.txt 2>/dev/null); do
              cp "site/assets/img/capas/$f.jpg" /tmp/guarda/capas/ 2>/dev/null || true
              cp "site/capas_base/$f.jpg" /tmp/guarda/base/ 2>/dev/null || true
              grep "^$f " site/capas_info/.feitas >> /tmp/guarda/feitas.txt 2>/dev/null || true
            done
            for i in 1 2 3 4 5 6; do
              git fetch -q origin main && git reset -q --hard origin/main
              # só as capas montadas nesta vez: nunca sobrescreve os textos (capas_info/*.json) mudados enquanto rodava
              mkdir -p site/capas_base
              cp /tmp/guarda/base/*.jpg site/capas_base/ 2>/dev/null || true
              cp /tmp/guarda/capas/*.jpg site/assets/img/capas/ 2>/dev/null || true
              python3 - <<'PY'
          from pathlib import Path
          m = Path("site/capas_info/.feitas"); g = Path("/tmp/guarda/feitas.txt")
          fe = dict(l.split(" ", 1) for l in (m.read_text().splitlines() if m.exists() else []) if " " in l)
          for l in (g.read_text().splitlines() if g.exists() else []):
              if " " in l:
                  k, v = l.split(" ", 1); fe[k] = v
          m.write_text("".join(f"{k} {v}\n" for k, v in sorted(fe.items())))
          PY
              python3 site/gerar.py > /dev/null
              git add -A
              git diff --cached --quiet && return 0
              git commit -qm "Capas com informação montadas"
              git push -q && return 0
              sleep $((i * 4))
            done
            return 1
          }
          fim=$(( $(date +%s) + 120*60 ))
          while [ $(date +%s) -lt $fim ]; do
            antes=$(cat site/capas_info/.feitas 2>/dev/null)
            CAPA_IA=1 CAPA_MINUTOS=15 python3 site/capa_info.py | tee /tmp/saida.txt || true
            grep "^Capa com informação:" /tmp/saida.txt | sed 's/^Capa com informação: //' > /tmp/novas.txt || true
            enviar || echo "não consegui enviar desta vez"
            [ "$(python3 site/capa_info.py --pendentes)" = "0" ] && break
            [ "$antes" = "$(cat site/capas_info/.feitas 2>/dev/null)" ] && break   # nada novo: só falhas, para não girar à toa
          done
